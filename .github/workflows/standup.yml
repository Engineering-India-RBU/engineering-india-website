name: Engineering India Daily Standup

on:
  schedule:
    # Daily at 7 PM IST
    - cron: '30 13 * * *'

  workflow_dispatch:

jobs:
  send-standup:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Standup Message
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "content":"🚀 **Engineering India Standup**\n\nPlease reply in a thread using the format below:\n\n**1️⃣ What did you complete since the last update?**\n- \n\n**2️⃣ What are you working on today?**\n- \n\n**3️⃣ Any blockers or help needed?**\n- \n\n🔗 Include GitHub Issue / PR links whenever applicable.\n\n⏰ Please post your update before 8:00 PM."
          }' \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"